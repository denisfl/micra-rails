name: Publish gem to RubyGems

# Tag-driven release:
#   git tag v0.1.0 && git push --tags  →  publishes 0.1.0 via OIDC
#
# Uses RubyGems Trusted Publishing (OIDC) — no API key secret needed.
# Setup once at: rubygems.org → Profile → OIDC: Trusted Publishers → Add
#   Repository: denisfl/micra-rails
#   Workflow: publish.yml
#   Environment: (leave empty)
#   Gem name: micra-rails

on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required for OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

      - name: Build & publish gem
        uses: rubygems/release-gem@v1
